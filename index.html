<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아르카디아 - 파이오니어 힐링 광장</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f8ff; padding: 20px; }
        .product { border: 2px solid #87ceeb; padding: 20px; margin: 10px auto; width: 80%; max-width: 300px; border-radius: 15px; background: white; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #87ceeb; border: none; border-radius: 10px; color: white; margin-top: 10px; }
    </style>
    <!-- Pi SDK 불러오기 -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>아르카디아에 오신 것을 환영합니다!</h1>
    <p>파이오니어들을 위한 힐링 공간</p>

    <div class="product">
        <h3>아르카디아의 전설적인 검</h3>
        <p>가격: 10 Pi</p>
        <button onclick="orderProduct('검')">검 구매하기</button>
    </div>

    <div class="product">
        <h3>아르카디아 생명 물약</h3>
        <p>가격: 2 Pi</p>
        <button onclick="orderProduct('물약')">물약 구매하기</button>
    </div>

    <script>
        Pi.init({ version: "2.0", sandbox: true });

        async function orderProduct(itemName) {
            try {
                const payment = await Pi.createPayment({
                    amount: itemName === '검' ? 10 : 2,
                    memo: itemName + " 구매",
                    metadata: { item: itemName },
                }, {
                    onReadyForServerApproval: (paymentId) => alert("결제 창이 떴습니다!"),
                    onReadyForServerCompletion: (paymentId, txid) => alert("결제 성공!"),
                    onCancel: (paymentId) => alert("결제 취소됨."),
                    onError: (error, payment) => alert("오류: " + error)
                });
            } catch (err) {
                alert("결제 오류: " + err);
            }
        }
    </script>
</body>
</html>
